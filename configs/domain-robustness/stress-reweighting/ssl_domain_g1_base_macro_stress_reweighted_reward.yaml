experiment_name: ssl_domain_g1_base_macro_stress_reweighted_reward
status: ready_to_run

launch_selection:
  candidate_family: null
  panel_scope: null

reference_baseline:
  config_name: custom_custom
  algorithm: PPO
  reward_mode: custom_reward_with_training_only_domain_stress_reweighting
  policy_mode: custom_mlp_policy
  checkpoint_selection_rule: checkpoint_robust_score
  configuration_selection_rule: robust_q25_retention
  buy_cost_pct: 0.001
  sell_cost_pct: 0.001
  action_constraint: long_only_box_[-1,1]_scaled_by_hmax

notes:
  execution_mode: Run only base_macro with training-only reward stress reweighting.
  dataset_requirement: Use processed_final_fixed_external_lagclean_full.csv for alignment with G0 and Phase-2 outputs.
  baseline_reuse_expected: false
  phase: SSL/domain-generalization G1, training-time intervention.
  pre_registered_hypothesis: Upweighting high absolute-return training domains should make PPO care more about stress states and improve benchmark-relative OOS robustness without adding features.
  isolation_rule: Use the original checkpoint_robust_score so the test isolates training-time reward reweighting rather than G0 temporal selection.
  kill_rules: Reject if median test Sharpe, benchmark-excess Sharpe, benchmark-excess return, drawdown, or turnover-adjusted behavior degrade versus the frozen base_macro teacher/reference.

runner_kwargs:
  base_config_name: custom_custom
  candidate_feature_families: []
  feature_set_filter:
    - base_macro
  seeds:
    - 42
    - 123
    - 999
  total_timesteps: 200000
  max_folds: null
  es_mode: relaxed
  dropout_p: 0.1
  eval_freq: 8192
  checkpoint_freq: 4096
  checkpoint_selection_rule: checkpoint_robust_score
  domain_reward_scaling:
    enabled: true
    derived_domain: benchmark_abs_return_tercile
    mode: stress_upweight
    domain_weights:
      low_abs_return: 0.85
      mid_abs_return: 1.0
      high_abs_return: 1.2
    min_multiplier: 0.75
    max_multiplier: 1.25
  verbose: 0
